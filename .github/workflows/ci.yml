name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pytest

  package:
    # The wheel installs on its own and presses a button, as a user would run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv build
      - run: |
          uv venv --python 3.11 "$RUNNER_TEMP/try"
          uv pip install --python "$RUNNER_TEMP/try/bin/python" dist/*.whl
          "$RUNNER_TEMP/try/bin/macropress" press examples/invoice/invoice.xlsm \
            --button "Calculate totals" --out "$RUNNER_TEMP/invoice-done.xlsm"
